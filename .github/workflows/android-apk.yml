name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Optional version name for this APK build (e.g., 1.2.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle # Caching Gradle dependencies saves 2-4 mins per run

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >-
          flutter build apk --release
          --android-skip-build-dependency-validation
          --build-number=${{ github.run_number }}
          ${{ inputs.build_name != '' && format('--build-name={0}', inputs.build_name) || '' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-radio-apk-v${{ inputs.build_name || '1.0.0' }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
